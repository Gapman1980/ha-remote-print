<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remote Print</title>
<style>
:root { --a: #30D158; --b: #00CFFF; --bg: #0b0e1a; --card: #151a2e; --t: #fff; --m: #8a94a8; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: radial-gradient(120% 60% at 50% 0%, #1b2440 0%, var(--bg) 60%); color: var(--t);
       font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.box { border-radius: 20px; padding: 16px; background: linear-gradient(160deg, #161a2e, #0b0e1a);
       box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--a) 40%, transparent), 0 0 20px color-mix(in srgb, var(--a) 18%, transparent); }
.top { display: flex; align-items: center; }
.indietro { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px 10px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.07); color: #fff; font-size: 16px; font-weight: 800; transition: transform .15s; }
.indietro:active { transform: scale(.94); } .indietro svg { width: 20px; height: 20px; }
.hd { display: flex; align-items: center; gap: 14px; }
.hd svg { width: 84px; height: 60px; flex: none; filter: drop-shadow(0 0 6px var(--a)); }
.hd b { display: block; font-size: 22px; } .hd span { color: var(--m); font-size: 13px; }
.co { fill: #24213a; stroke: var(--a); stroke-width: 1.6; } .fo { fill: #eef2f7; } .fe { fill: #05060c; }
.ri { stroke: #8a94a8; stroke-width: 1; } .led { fill: var(--a); animation: lamp 2s ease-in-out infinite; }
.usc { transform: translateY(-6px); } .lavora .usc { animation: esce 2s ease-in-out infinite; }
@keyframes esce { from { transform: translateY(-9px); } to { transform: translateY(3px); } }
@keyframes lamp { 50% { opacity: .3; } }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; border-radius: 18px;
        border: 2px dashed color-mix(in srgb, var(--b) 60%, transparent); background: color-mix(in srgb, var(--b) 7%, transparent);
        text-align: center; padding: 16px; cursor: pointer; transition: transform .15s; }
.drop:active { transform: scale(.98); }
.drop .ic { font-size: 40px; animation: su 2.2s ease-in-out infinite; } @keyframes su { 50% { transform: translateY(-5px); } }
.drop b { font-size: 18px; } .drop span { color: var(--m); font-size: 13px; }
.drop.pieno { border-style: solid; border-color: var(--a); background: color-mix(in srgb, var(--a) 10%, transparent); }
input[type=file] { display: none; }
.riga { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 2px; border-bottom: 1px solid rgba(255,255,255,.07); }
.riga:last-child { border: none; } .riga label { font-size: 15px; font-weight: 600; } .riga small { display: block; color: var(--m); font-size: 12px; font-weight: 400; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #fff; font-size: 20px; font-weight: 700; }
.step output { min-width: 34px; text-align: center; font-size: 18px; font-weight: 800; }
.sw { position: relative; width: 52px; height: 30px; flex: none; }
.sw input { display: none; } .sw i { position: absolute; inset: 0; border-radius: 15px; background: rgba(255,255,255,.15); transition: .2s; }
.sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; }
.sw input:checked + i { background: var(--a); box-shadow: 0 0 10px var(--a); } .sw input:checked + i::after { left: 25px; }
.pg { width: 120px; padding: 9px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #fff; font-size: 15px; text-align: center; }
.vai { position: relative; overflow: hidden; width: 100%; height: 64px; border: none; border-radius: 18px; font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #04210f;
       background: linear-gradient(90deg, #30D158, #7CFFB0, #30D158); background-size: 200% 100%; animation: luce 3s linear infinite; box-shadow: 0 0 22px #30D15888; }
.vai:disabled { filter: grayscale(1) brightness(.6); animation: none; box-shadow: none; }
@keyframes luce { to { background-position: -200% 0; } }
.vai .pr { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.35); transition: width .2s; }
.msg { min-height: 20px; text-align: center; font-size: 14px; font-weight: 700; }
.msg.ok { color: var(--a); } .msg.ko { color: #FF453A; }
.avv { display: none; padding: 10px 12px; border-radius: 14px; background: #FF9F0A22; border: 1px solid #FF9F0A; color: #FFD08A; font-size: 13px; font-weight: 700; }
h3 { margin: 4px 2px 0; font-size: 12px; letter-spacing: 1px; color: var(--m); text-transform: uppercase; }
.lv { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.lv .n { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; overflow-wrap: anywhere; } .lv .n small { display: block; color: var(--m); font-weight: 400; font-size: 12px; }
.pill { padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; border: 1px solid; }
.p-queued { color: #FFD60A; border-color: #FFD60A; } .p-printing { color: var(--b); border-color: var(--b); animation: lamp 1s infinite; }
.p-done { color: var(--a); border-color: var(--a); } .p-canceled { color: var(--m); border-color: var(--m); }
.x { border: none; background: #FF453A22; color: #FF6961; border-radius: 10px; padding: 6px 9px; font-weight: 800; font-size: 12px; }
.vuoto { color: var(--m); font-size: 13px; text-align: center; padding: 8px; }
/* 1.3.0: printer selector (only with more than one printer) */
.prs { display: none; flex-wrap: wrap; gap: 8px; }
.prs button { flex: 1 1 140px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 12px; border-radius: 14px;
              border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: var(--m); font-size: 15px; font-weight: 800; transition: .2s; }
.prs button:active { transform: scale(.96); }
.prs button.on { color: #fff; border-color: var(--b); background: color-mix(in srgb, var(--b) 16%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--b) 45%, transparent); }
.prs button i { width: 9px; height: 9px; border-radius: 50%; background: var(--m); flex: none; }
.prs button.on i { background: var(--b); box-shadow: 0 0 8px var(--b); animation: lamp 2s ease-in-out infinite; }
.lv .pn { color: var(--b); font-weight: 700; }
/* 1.4.0: print preview with scale / position */
.anb { display: none; width: 100%; min-height: 52px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--b) 55%, transparent);
       background: color-mix(in srgb, var(--b) 9%, transparent); color: #fff; font-size: 16px; font-weight: 800; transition: .2s; }
.anb:active { transform: scale(.98); }
.anb.on { background: color-mix(in srgb, var(--b) 20%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--b) 45%, transparent); }
.ed { display: none; flex-direction: column; gap: 10px; }
.tb { display: flex; gap: 8px; }
.tb button { flex: 1; min-height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05);
             color: #fff; font-size: 14px; font-weight: 800; transition: .2s; }
.tb button:active { transform: scale(.95); }
.tb button.on { border-color: var(--b); background: color-mix(in srgb, var(--b) 18%, transparent); box-shadow: 0 0 12px color-mix(in srgb, var(--b) 40%, transparent); }
.fg { display: flex; justify-content: center; padding: 6px 0; }
.sh { position: relative; background: #fff; border-radius: 3px; overflow: hidden; touch-action: none; cursor: grab;
      box-shadow: 0 8px 28px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.25); transition: width .25s, height .25s; }
.sh.drag { cursor: grabbing; }
.sh .mg { position: absolute; border: 1.5px dashed rgba(255,69,58,.75); pointer-events: none; z-index: 2; }
.sh img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none;
          outline: 1.5px solid color-mix(in srgb, var(--b) 70%, transparent); background: #fff; }
.sh .ld { position: absolute; inset: 0; display: grid; place-items: center; color: #555; font-size: 13px; font-weight: 700; z-index: 3; }
.sl { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
.sl input { flex: 1; accent-color: var(--b); height: 30px; }
.sl output { min-width: 52px; text-align: right; font-size: 17px; font-weight: 900; color: var(--b); }
.pnv { display: none; align-items: center; justify-content: center; gap: 14px; color: var(--m); font-size: 13px; font-weight: 700; }
.pnv button { width: 40px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #fff; font-size: 18px; font-weight: 900; }
.edn { color: var(--m); font-size: 12px; text-align: center; }
/* 1.4.1: remove finished jobs from the list */
.lh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.svuota { display: none; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: var(--m); border-radius: 999px;
          padding: 5px 12px; font-size: 12px; font-weight: 800; transition: .2s; }
.svuota:active { transform: scale(.95); }
.svuota.conf { color: #FF6961; border-color: #FF453A; background: #FF453A22; box-shadow: 0 0 12px #FF453A55; animation: lamp 1s infinite; }
.del { border: none; background: rgba(255,255,255,.06); color: var(--m); border-radius: 10px; padding: 6px 8px; font-size: 13px; transition: .2s; }
.del:active { transform: scale(.9); background: #FF453A33; }
.lv.via { animation: via .3s ease-in forwards; }
@keyframes via { to { opacity: 0; transform: translateX(40px); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="indietro" id="indietro" type="button"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="back"></span></button></div>
  <div class="box"><div class="hd" id="hd">
    <svg viewBox="0 0 76 40"><rect class="fo" x="27" y="2" width="22" height="10" rx="1"/><rect class="co" x="19" y="10" width="38" height="17" rx="4"/>
      <rect class="fe" x="25" y="24" width="26" height="4" rx="1.5"/><g class="usc"><rect class="fo" x="27" y="25" width="22" height="9" rx="1"/>
      <path class="ri" d="M30 28 H46 M30 31 H42"/></g><circle class="led" cx="51" cy="15" r="1.6"/></svg>
    <div><b data-t="title"></b><span data-t="subtitle"></span></div>
  </div></div>
  <h3 id="prs_h" style="display:none" data-t="printer"></h3>
  <div class="prs" id="prs"></div>
  <div class="avv" id="avv"></div>
  <label class="drop" id="drop" for="file"><div class="ic">📄</div><b id="dt"></b><span id="ds"></span></label>
  <input type="file" id="file" accept=".pdf,.txt,.heic,.heif,image/*,application/pdf,text/plain">
  <div class="box" style="padding:6px 16px">
    <div class="riga"><label data-t="copies"></label><div class="step"><button type="button" id="meno">−</button><output id="cp">1</output><button type="button" id="piu">+</button></div></div>
    <div class="riga"><label><span data-t="duplex"></span><small data-t="duplex_s"></small></label><label class="sw"><input type="checkbox" id="fr"><i></i></label></div>
    <div class="riga"><label><span data-t="fit"></span><small data-t="fit_s"></small></label><label class="sw"><input type="checkbox" id="ad" checked><i></i></label></div>
    <div class="riga"><label><span data-t="pages"></span><small data-t="pages_s"></small></label><input class="pg" id="pg" inputmode="numeric"></div>
  </div>
  <button class="anb" id="anb" type="button">🔍 <span data-t="prev"></span></button>
  <div class="box ed" id="ed">
    <div class="tb"><button type="button" id="o_p">▯ <span data-t="port"></span></button><button type="button" id="o_l">▭ <span data-t="land"></span></button></div>
    <div class="fg" id="fg"><div class="sh" id="sh"><div class="mg" id="mgn"></div><img id="pim" alt=""><div class="ld" id="pld"></div></div></div>
    <div class="pnv" id="pnv"><button type="button" id="pg_p">‹</button><span id="pg_l"></span><button type="button" id="pg_n">›</button></div>
    <div class="sl"><span data-t="scale"></span><input type="range" id="sc" min="5" max="300" step="1"><output id="sco"></output></div>
    <div class="tb"><button type="button" id="b_fit">⤢ <span data-t="fitb"></span></button><button type="button" id="b_cen">✛ <span data-t="cen"></span></button><button type="button" id="b_100">100%</button></div>
    <div class="edn" id="edn"></div>
  </div>
  <button class="vai" id="vai" disabled><span class="pr" id="pr"></span><span style="position:relative" data-t="print"></span></button>
  <div class="msg" id="msg"></div>
  <div class="lh"><h3 data-t="recent"></h3><button class="svuota" id="svuota" type="button">🧹 <span id="sv_t" data-t="clear"></span></button></div>
  <div id="lista" style="display:flex;flex-direction:column;gap:8px"><div class="vuoto">…</div></div>
</div>
<script>
// Remote Print - Home Assistant add-on page (served through ingress)
const CFG = __CONFIG__;   // filled by the add-on: {lang, paper, duplex}
// 1.1.1: on Android the Home Assistant app could crash when returning from a filtered file picker
// (accept with extensions like .heic/.pdf). There the picker opens without filters; the add-on checks the type itself.
if (/Android/i.test(navigator.userAgent)) document.getElementById('file').removeAttribute('accept');
const I18N = {
  it: {back: 'Indietro', title: 'Stampa da remoto', subtitle: 'Scegli un file: la stampante di casa lo stampa, anche se sei fuori.',
       pick: 'Tocca per scegliere il file', pick_s: 'PDF, foto (JPG, PNG, HEIC) o testo · da File, Foto o iCloud', change: 'tocca per cambiarlo',
       copies: 'Copie', duplex: 'Fronte/retro', duplex_s: 'stampa su entrambi i lati', fit: 'Adatta al foglio', fit_s: 'rimpicciolisce se serve',
       pages: 'Pagine', pages_s: 'vuoto = tutte · es. 1-3,5', all: 'tutte', print: '🖨️ STAMPA A CASA', recent: 'Ultime stampe', none: 'Nessuna stampa ancora',
       sent: '✓ Inviato! La stampante di casa sta per stamparlo', uploading: 'Caricamento…', lost: '✗ Connessione persa durante il caricamento', lost2: '✗ File inviato ma nessuna risposta: guarda il Registro dell\'add-on (stampante raggiungibile? driver giusto?)',
       weird: 'Risposta inattesa', error: 'Errore', copy1: 'copia', copyN: 'copie', printer: 'Stampante',
       prev: 'Anteprima e posizione', port: 'Verticale', land: 'Orizzontale', scale: 'Scala', fitb: 'Adatta', cen: 'Centra',
       page: 'Pagina', allp: 'Trascina per spostare · le regolazioni valgono per tutte le pagine', drag: 'Trascina per spostare · il bordo rosso è il limite di stampa',
       prep: 'Preparo l\'anteprima…', clear: 'Svuota', sure: 'Tocca ancora per svuotare', rm: 'Togli dalla lista',
       st: {queued: 'In coda', printing: 'Stampa…', done: 'Stampato ✓', canceled: 'Annullato'},
       al: {'media-empty': 'Carta finita: aggiungi fogli', 'media-jam': 'Foglio inceppato', 'toner-low': 'Toner in esaurimento', 'toner-empty': 'Toner finito',
            'marker-supply-low': 'Inchiostro/toner in esaurimento', 'door-open': 'Sportello aperto', 'cover-open': 'Coperchio aperto',
            'offline': 'Stampante spenta o non raggiungibile: stamperà appena si riaccende'}},
  en: {back: 'Back', title: 'Remote Print', subtitle: 'Pick a file: your home printer prints it, even when you are away.',
       pick: 'Tap to choose a file', pick_s: 'PDF, photos (JPG, PNG, HEIC) or text · from Files, Photos or iCloud', change: 'tap to change it',
       copies: 'Copies', duplex: 'Two-sided', duplex_s: 'print on both sides', fit: 'Fit to page', fit_s: 'shrinks it if needed',
       pages: 'Pages', pages_s: 'empty = all · e.g. 1-3,5', all: 'all', print: '🖨️ PRINT AT HOME', recent: 'Recent prints', none: 'No prints yet',
       sent: '✓ Sent! Your home printer is about to print it', uploading: 'Uploading…', lost: '✗ Connection lost while uploading', lost2: '✗ File sent but no answer: check the add-on Log (printer reachable? right driver?)',
       weird: 'Unexpected answer', error: 'Error', copy1: 'copy', copyN: 'copies', printer: 'Printer',
       prev: 'Preview and position', port: 'Portrait', land: 'Landscape', scale: 'Scale', fitb: 'Fit', cen: 'Center',
       page: 'Page', allp: 'Drag to move · adjustments apply to all pages', drag: 'Drag to move · the red border is the printable limit',
       prep: 'Preparing the preview…', clear: 'Clear', sure: 'Tap again to clear', rm: 'Remove from the list',
       st: {queued: 'Queued', printing: 'Printing…', done: 'Printed ✓', canceled: 'Canceled'},
       al: {'media-empty': 'Out of paper', 'media-jam': 'Paper jam', 'toner-low': 'Toner low', 'toner-empty': 'Toner empty',
            'marker-supply-low': 'Ink/toner low', 'door-open': 'Door open', 'cover-open': 'Cover open',
            'offline': 'Printer off or unreachable: it will print when it comes back'}},
};
const lang = CFG.lang && CFG.lang !== 'auto' ? CFG.lang : ((navigator.language || 'en').slice(0, 2) === 'it' ? 'it' : 'en');
const T = I18N[lang] || I18N.en;
const $ = id => document.getElementById(id);
document.documentElement.lang = lang;
document.querySelectorAll('[data-t]').forEach(e => e.textContent = T[e.dataset.t]);
$('pg').placeholder = T.all; $('dt').textContent = T.pick; $('ds').textContent = T.pick_s;
$('fr').checked = !!CFG.duplex;
const POPUP = new URLSearchParams(location.search).get('popup');   // opened inside a dashboard popup (see examples/)
if (POPUP) document.querySelector('.wrap > .box').style.display = 'none';
// Back: inside a popup it asks the dashboard (postMessage) to reopen the printer popup; otherwise browser history
$('indietro').onclick = () => {
  if (POPUP) { window.parent.postMessage({remote_print: 'back', popup: POPUP}, location.origin); return; }
  try { window.top.history.length > 1 ? window.top.history.back() : (window.top.location.href = '/'); } catch (e) { history.back(); }
};
let copies = 1, chosen = null;
// 1.3.0: printer selector, shown only with more than one printer; the choice is remembered on this device
const PRS = Array.isArray(CFG.printers) ? CFG.printers : [];
let sel = 0;
try { const v = parseInt(localStorage.getItem('rp_printer'), 10); if (v >= 0 && v < PRS.length) sel = v; } catch (e) {}
function drawPrinters() {
  if (PRS.length < 2) return;
  $('prs_h').style.display = ''; $('prs').style.display = 'flex';
  $('prs').innerHTML = PRS.map((n, i) => `<button type="button" class="${i === sel ? 'on' : ''}" data-i="${i}"><i></i>🖨️ ${String(n).replace(/</g, '&lt;')}</button>`).join('');
  $('prs').querySelectorAll('button').forEach(b => b.onclick = () => {
    sel = +b.dataset.i; try { localStorage.setItem('rp_printer', sel); } catch (e) {}
    drawPrinters(); load();
    if (edOpen) loadPaper().then(draw);   // printable margins change with the printer
  });
}

// ---------- 1.4.0: preview with scale / position (#5) ----------
// P = file uploaded once for the preview {token, name, pages, sizes[[w,h] pt]}, PAP = sheet {paper [W,H] pt portrait, margins}
// L = layout sent with the print: orientation, scale, centre offset from the sheet centre in points (y up)
let P = null, PAP = null, L = {o: 'p', s: 1, dx: 0, dy: 0}, pgN = 1, edOpen = false, K = 1, lastSrc = '';
const sheet = () => { const [w, h] = PAP.paper; return L.o === 'l' ? [h, w] : [w, h]; };
const marg = () => { const m = PAP.margins; if (L.o === 'p') return m;
  const a = Math.max(m.t, m.b), b = Math.max(m.l, m.r); return {l: a, r: a, t: b, b: b}; };   // landscape: safe side
const psize = () => (P.sizes[pgN - 1] || P.sizes[0] || [595, 842]);
async function loadPaper() {
  try { PAP = await (await fetch('paper?printer=' + sel, {cache: 'no-store'})).json(); }
  catch (e) { PAP = {paper: [595.28, 841.89], margins: {l: 12, r: 12, t: 12, b: 12}}; }
}
function fit() {
  const [W, H] = sheet(), m = marg(), [w, h] = psize();
  L.s = Math.min((W - m.l - m.r) / w, (H - m.t - m.b) / h); center();
}
function center() { const m = marg(); L.dx = (m.l - m.r) / 2; L.dy = (m.b - m.t) / 2; }
function draw() {
  if (!P || !PAP) return;
  const [W, H] = sheet(), m = marg(), [w, h] = psize();
  const avail = Math.max(200, $('fg').clientWidth - 4), maxH = Math.min(window.innerHeight * 0.55, 560);
  K = Math.min(avail / W, maxH / H);
  const sh = $('sh'); sh.style.width = W * K + 'px'; sh.style.height = H * K + 'px';
  Object.assign($('mgn').style, {left: m.l * K + 'px', top: m.t * K + 'px', right: m.r * K + 'px', bottom: m.b * K + 'px'});
  const im = $('pim'), iw = L.s * w * K, ih = L.s * h * K;
  Object.assign(im.style, {width: iw + 'px', height: ih + 'px', left: (W / 2 + L.dx - L.s * w / 2) * K + 'px', top: (H / 2 - L.dy - L.s * h / 2) * K + 'px'});
  const r = Math.min(150, Math.max(15, Math.ceil(72 * L.s * K * (window.devicePixelRatio || 1) / 15) * 15));   // dpi steps of 15 = cached
  const src = `preview?token=${encodeURIComponent(P.token)}&page=${pgN}&r=${r}`;
  if (src !== lastSrc) { lastSrc = src; im.src = src; }
  $('sc').value = Math.round(L.s * 100); $('sco').textContent = Math.round(L.s * 100) + '%';
  $('o_p').classList.toggle('on', L.o === 'p'); $('o_l').classList.toggle('on', L.o === 'l');
  $('pnv').style.display = P.pages > 1 ? 'flex' : 'none'; $('pg_l').textContent = `${T.page} ${pgN} / ${P.pages}`;
  $('edn').textContent = P.pages > 1 ? T.allp : T.drag;
}
function closeEd() { edOpen = false; $('ed').style.display = 'none'; $('anb').classList.remove('on'); }
async function openEd() {
  edOpen = true; $('anb').classList.add('on'); $('ed').style.display = 'flex';
  if (P) { draw(); return; }
  $('pim').removeAttribute('src'); lastSrc = ''; $('pld').textContent = T.prep; $('pld').style.display = 'grid';
  $('sh').style.width = '210px'; $('sh').style.height = '297px';
  const fd = new FormData(); fd.append('lang', lang); fd.append('file', chosen, chosen.name);
  const want = chosen;
  try {
    const [r] = await Promise.all([fetch('prepare', {method: 'POST', body: fd}).then(x => x.json()), loadPaper()]);
    if (want !== chosen || !edOpen) return;   // file changed meanwhile
    if (!r.ok) { closeEd(); msg('✗ ' + (r.error || T.error), false); return; }
    P = r; pgN = 1; const [w, h] = psize(); L.o = w > h ? 'l' : 'p'; fit();
    $('pld').style.display = 'none'; draw();
  } catch (e) { closeEd(); msg(T.lost, false); }
}
$('anb').onclick = () => edOpen ? closeEd() : (chosen && openEd());
$('o_p').onclick = () => { L.o = 'p'; fit(); draw(); };
$('o_l').onclick = () => { L.o = 'l'; fit(); draw(); };
$('b_fit').onclick = () => { fit(); draw(); };
$('b_cen').onclick = () => { center(); draw(); };
$('b_100').onclick = () => { L.s = 1; center(); draw(); };
$('sc').oninput = e => {   // zoom around the current centre
  L.s = Math.max(.05, +e.target.value / 100); draw(); };
$('pg_p').onclick = () => { if (pgN > 1) { pgN--; draw(); } };
$('pg_n').onclick = () => { if (P && pgN < P.pages) { pgN++; draw(); } };
{ // drag the page on the sheet (finger or mouse)
  let st = null; const sh = $('sh');
  sh.addEventListener('pointerdown', e => { if (!P) return; st = {x: e.clientX, y: e.clientY, dx: L.dx, dy: L.dy}; sh.setPointerCapture(e.pointerId); sh.classList.add('drag'); });
  sh.addEventListener('pointermove', e => { if (!st) return; L.dx = st.dx + (e.clientX - st.x) / K; L.dy = st.dy - (e.clientY - st.y) / K; draw(); });
  const end = () => { st = null; sh.classList.remove('drag'); };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
}
window.addEventListener('resize', () => edOpen && draw());
drawPrinters();
$('meno').onclick = () => { copies = Math.max(1, copies - 1); $('cp').textContent = copies; };
$('piu').onclick = () => { copies = Math.min(20, copies + 1); $('cp').textContent = copies; };
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
$('file').onchange = e => {
  chosen = e.target.files[0] || null;
  $('drop').classList.toggle('pieno', !!chosen);
  $('dt').textContent = chosen ? chosen.name : T.pick;
  $('ds').textContent = chosen ? kb(chosen.size) + ' · ' + T.change : T.pick_s;
  $('vai').disabled = !chosen; $('msg').textContent = ''; $('msg').className = 'msg';
  P = null; closeEd(); $('anb').style.display = chosen ? 'block' : 'none';   // new file: new preview
};
const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = 'msg ' + (ok ? 'ok' : 'ko'); };
$('vai').onclick = () => {
  if (!chosen) return;
  const fd = new FormData();
  fd.append('printer', sel); fd.append('copies', copies); fd.append('duplex', $('fr').checked ? '1' : '0');
  fd.append('fit', $('ad').checked ? '1' : '0'); fd.append('pages', $('pg').value.trim()); fd.append('lang', lang);
  if (edOpen && P) {   // already uploaded for the preview: send the token and the layout, not the file again
    fd.append('token', P.token); fd.append('name', chosen.name);
    fd.append('layout', JSON.stringify({o: L.o, s: +L.s.toFixed(4), dx: +L.dx.toFixed(2), dy: +L.dy.toFixed(2)}));
  } else fd.append('file', chosen, chosen.name);
  const x = new XMLHttpRequest();
  x.open('POST', 'print');
  x.upload.onprogress = ev => { if (ev.lengthComputable) $('pr').style.width = (ev.loaded / ev.total * 100) + '%'; };
  x.onload = () => {
    $('pr').style.width = '0'; $('vai').disabled = false;
    let r = {}; try { r = JSON.parse(x.responseText); } catch (e) { r = {ok: false, error: T.weird + ' (' + x.status + ')'}; }
    if (r.ok) { msg(T.sent, true); $('file').value = ''; $('file').onchange({target: {files: []}}); load(); }
    else msg('✗ ' + (r.error || T.error), false);
  };
  let sent = false;   // upload finished: a later error means the server did not answer in time, not a bad upload
  x.upload.onload = () => { sent = true; };
  x.onerror = () => { $('pr').style.width = '0'; $('vai').disabled = false; msg(sent ? T.lost2 : T.lost, false); };
  $('vai').disabled = true; msg(T.uploading, true); x.send(fd);
};
async function load() {
  try {
    const r = await (await fetch('jobs?printer=' + sel, {cache: 'no-store'})).json();
    const L = r.jobs || [];
    const molti = new Set(L.map(j => j.by).filter(Boolean)).size > 1;   // 1.5.0: show who printed only when there is more than one person
    $('lista').innerHTML = L.length ? L.map(j => `<div class="lv"><div class="n">${j.name.replace(/</g, '&lt;')}<small>${new Date(j.time * 1000).toLocaleString(lang, {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${j.copies} ${j.copies > 1 ? T.copyN : T.copy1}${PRS.length > 1 && j.printer ? ` · <span class="pn">${String(j.printer).replace(/</g, '&lt;')}</span>` : ''}${molti && j.by ? ` · 👤 ${String(j.by).replace(/</g, '&lt;')}` : ''}</small></div>
      <span class="pill p-${j.state}">${T.st[j.state] || j.state}</span>${['queued', 'printing'].includes(j.state) ? `<button class="x" onclick="cancelJob(${j.id})">✕</button>`
        : `<button class="del" title="${T.rm}" aria-label="${T.rm}" onclick="forgetJob(this, ${j.id}, ${j.time})">🗑</button>`}</div>`).join('')
      : `<div class="vuoto">${T.none}</div>`;
    $('svuota').style.display = L.some(j => !['queued', 'printing'].includes(j.state)) ? 'inline-block' : 'none';
    const al = (r.alerts || []).map(a => T.al[a.replace(/-(warning|error|report)$/, '')] || a);
    $('avv').style.display = al.length ? 'block' : 'none'; $('avv').textContent = '⚠️ ' + al.join(' · ');
    $('hd').classList.toggle('lavora', L.some(j => j.state === 'printing'));
  } catch (e) {}
}
async function cancelJob(id) { await fetch('cancel?id=' + id, {method: 'POST'}); load(); }
// 1.4.1: 🗑 removes one finished job from the list; "Clear" needs a second tap within 3 s (no browser dialogs inside the app)
async function forgetJob(b, id, t) {
  b.closest('.lv').classList.add('via');
  await Promise.all([fetch(`forget?id=${id}&t=${t}`, {method: 'POST'}), new Promise(r => setTimeout(r, 300))]); load();
}
let svT = null;
$('svuota').onclick = async () => {
  const b = $('svuota');
  if (!b.classList.contains('conf')) {
    b.classList.add('conf'); $('sv_t').textContent = T.sure;
    svT = setTimeout(() => { b.classList.remove('conf'); $('sv_t').textContent = T.clear; }, 3000); return;
  }
  clearTimeout(svT); b.classList.remove('conf'); $('sv_t').textContent = T.clear;
  document.querySelectorAll('#lista .lv').forEach(r => { if (r.querySelector('.del')) r.classList.add('via'); });
  await Promise.all([fetch('clear', {method: 'POST'}), new Promise(r => setTimeout(r, 300))]); load();
};
load(); setInterval(load, 3000);
