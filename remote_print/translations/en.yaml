configuration:
  printer_name:
    name: Printer name (optional)
    description: "Name of the main printer shown on the page when you have more than one printer (e.g. HP Office). Empty = its IP address."
  other_printers:
    name: Other printers (optional)
    description: "Extra printers to choose from on the page. Each one: name, printer_uri, driver (driverless or brlaser), brother_model (brlaser only). Easiest with ⋮ → Edit in YAML, see Documentation."
  printer_uri:
    name: Printer URI
    description: "IPP address of your printer, e.g. ipp://192.168.1.100/ipp/print (most AirPrint printers). Some use ipps:// or /ipp instead of /ipp/print."
  driver:
    name: Driver
    description: "driverless = AirPrint / IPP Everywhere printers (almost all). brlaser = Brother mono lasers WITHOUT AirPrint (e.g. DCP-1610W): then the address is socket://PRINTER-IP:9100."
  brother_model:
    name: Brother model (brlaser only)
    description: "Part of the model name used to pick the brlaser driver, e.g. DCP-1600, HL-1200, MFC-L2710. If nothing matches, the Log lists the available models."
  paper:
    name: Paper size
    description: Default paper size.
  duplex_default:
    name: Two-sided by default
    description: The 'two-sided' switch on the page starts turned on.
  bw_default:
    name: Black & white by default
    description: "The 'Black & white' switch on the page starts turned on (handy if you mostly print documents)."
  keep_days:
    name: Keep uploaded files (days)
    description: Uploaded files are deleted after this many days.
  language:
    name: Language
    description: Page language. 'auto' follows the phone language (Italian or English).
  lan_access:
    name: Direct access from the local network
    description: "Off = only through Home Assistant (safe, admins only). On = also at http://HOME-ASSISTANT-IP:PORT after you set a port in the Network section, so non-admin users can use it in a Webpage card. Only local network addresses are accepted, but ANYONE on your Wi-Fi can print: never forward this port on the router."
  allowed_users:
    name: Allowed non-admin users
    description: "Home Assistant usernames (e.g. alisha) that can use Remote Print without being administrators. Administrators can always use it; empty list = administrators only."
network:
  8099/tcp: "Direct access port (only with lan_access on). Empty = disabled."
