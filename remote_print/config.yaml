name: Remote Print
version: "1.3.0"
slug: remote_print
description: Upload a file from your phone (even away from home) and print it on your network printer. Driverless CUPS (IPP Everywhere / AirPrint), plus brlaser for Brother lasers without AirPrint.
url: https://github.com/Gapman1980/ha-remote-print
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
hassio_api: true
panel_icon: mdi:printer-wireless
panel_title: Print
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct access from your local network (also turn on lan_access). Empty = disabled."
options:
  printer_uri: "ipp://192.168.1.100/ipp/print"
  driver: driverless
  brother_model: "DCP-1600"
  paper: A4
  duplex_default: false
  keep_days: 3
  language: auto
  lan_access: false
  other_printers: []
schema:
  printer_name: str?
  printer_uri: str
  driver: list(driverless|brlaser)
  brother_model: str
  other_printers:
    - name: str
      printer_uri: str
      driver: list(driverless|brlaser)?
      brother_model: str?
  paper: list(A4|A5|Letter|Legal)
  duplex_default: bool
  keep_days: int(1,30)
  language: list(auto|en|it)
  lan_access: bool
