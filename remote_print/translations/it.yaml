configuration:
  printer_name:
    name: Nome stampante (facoltativo)
    description: "Nome della stampante principale mostrato nella pagina quando ne hai più di una (es. HP Ufficio). Vuoto = il suo indirizzo IP."
  other_printers:
    name: Altre stampanti (facoltativo)
    description: "Stampanti in più da scegliere nella pagina. Per ognuna: name, printer_uri, driver (driverless o brlaser), brother_model (solo brlaser). Più comodo da ⋮ → Modifica in YAML, vedi Documentazione."
  printer_uri:
    name: Indirizzo stampante
    description: "Indirizzo IPP della stampante, es. ipp://192.168.1.100/ipp/print (quasi tutte le stampanti AirPrint). Alcune usano ipps:// oppure /ipp al posto di /ipp/print."
  driver:
    name: Driver
    description: "driverless = stampanti AirPrint / IPP Everywhere (quasi tutte). brlaser = laser Brother in bianco e nero SENZA AirPrint (es. DCP-1610W): in questo caso l'indirizzo è socket://IP-STAMPANTE:9100."
  brother_model:
    name: Modello Brother (solo brlaser)
    description: "Parte del nome del modello per scegliere il driver brlaser, es. DCP-1600, HL-1200, MFC-L2710. Se non lo trova, il Registro elenca i modelli disponibili."
  paper:
    name: Formato carta
    description: Formato carta predefinito.
  duplex_default:
    name: Fronte/retro predefinito
    description: L'interruttore 'Fronte/retro' della pagina parte già acceso.
  keep_days:
    name: Conserva i file caricati (giorni)
    description: I file caricati vengono cancellati dopo questi giorni.
  language:
    name: Lingua
    description: Lingua della pagina. 'auto' segue la lingua del telefono (italiano o inglese).
  lan_access:
    name: Accesso diretto dalla rete di casa
    description: "Spento = solo da Home Assistant (sicuro, solo amministratori). Acceso = anche da http://IP-HOME-ASSISTANT:PORTA dopo aver messo una porta nella sezione Rete, così anche gli utenti non amministratori la usano in una card Pagina web. Sono accettati solo indirizzi della rete locale, ma CHIUNQUE sia sul tuo Wi-Fi può stampare: non aprire mai questa porta sul router."
  allowed_users:
    name: Utenti non amministratori ammessi
    description: "Nomi utente di Home Assistant (es. alisha) che possono usare la stampa anche senza essere amministratori. Gli amministratori entrano sempre; lista vuota = solo amministratori."
network:
  8099/tcp: "Porta per l accesso diretto (solo con lan_access acceso). Vuota = disattivata."
