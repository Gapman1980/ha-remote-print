# Remote Print - printer mini card + popup (Home Assistant dashboard, sections view)
# Requires (HACS): button-card, browser_mod, card-mod.
# Set the three variables below (in the mini card AND in the popup button-card):
#   prefix: start of your printer's sensor ids, e.g. 'sensor.epson_xp_960_series_' (IPP integration)
#           or 'sensor.hp_laserjet_' (HP Printer integration)
#   status: the sensor with the printer state, e.g. 'sensor.epson_xp_960_series' (IPP) or 'sensor.hp_laserjet_status' (HP)
#   name:   the name shown in the popup
# Ink / toner levels are found AUTOMATICALLY: every % sensor with that prefix that is an ink, toner or cartridge
# (the IPP integration creates one per colour: black, cyan, magenta, yellow ...). Colour printers get one bar per colour.
# Most network printers are found by Home Assistant itself: Settings -> Devices & services -> "Discovered" -> IPP.
# Replace  YOUR_INGRESS_TOKEN  with the token printed in the add-on log: "Ingress URL for the dashboard popup: ...".
# Double tap the mini card -> printer popup -> "UPLOAD FILE AND PRINT" opens the add-on page inside a popup.

# 1) mini card: put it in a section
type: custom:button-card
entity: sensor.YOUR_PRINTER_status
name: Printer
variables:
  prefix: sensor.YOUR_PRINTER_
  status: sensor.YOUR_PRINTER_status
  name: My printer
section_mode: true
grid_options:
  columns: 3
  rows: 1.5
show_name: false
show_state: false
show_icon: false
show_entity_picture: false
tap_action:
  action: none
hold_action:
  action: none
custom_fields:
  mk: |-
    [[[

    const rpInks = (S, P) => Object.keys(S).filter(i => i.startsWith(P) && S[i] && S[i].attributes && (S[i].attributes.marker_type !== undefined || (S[i].attributes.unit_of_measurement === '%' && /(toner|ink|cartridge)(_level)?$|_(black|cyan|magenta|yellow)$/i.test(i))) && !/remaining|impression|manufactur|date|serial|install|status/i.test(i) && !isNaN(parseFloat(S[i].state))).map(i => { const f = S[i].attributes.friendly_name || i; const n = f.replace(/^.*?(?=\b(black|cyan|magenta|yellow|photo|gr[ae]y|light|matte|colou?r|tri|nero|ciano|giallo|waste)\b)/i, '').replace(/[\s_]*level$/i, '') || f; const k = (i + ' ' + f).toLowerCase(); const col = /cyan|ciano/.test(k) ? '#00C8FF' : /magenta/.test(k) ? '#FF3DA6' : /yellow|giallo/.test(k) ? '#FFD60A' : /black|nero|matte|photo/.test(k) ? '#D9DEE8' : '#A78BFA'; const r = /black|nero/.test(k) ? 0 : /cyan/.test(k) ? 1 : /magenta/.test(k) ? 2 : /yellow/.test(k) ? 3 : 4; return {id: i, n, col, r, v: Math.max(0, Math.min(100, parseFloat(S[i].state)))}; }).sort((a, b) => a.r - b.r || a.n.localeCompare(b.n));
    const inks = rpInks(states, variables.prefix);
    const s = states[variables.status]?.state || 'unavailable';
    const tn = inks.length ? Math.min(...inks.map(x => x.v)) : NaN;   // the emptiest ink / toner
    const spenta = ['off', 'unavailable', 'unknown'].includes(s);
    const stampa = /print|process|busy|warm/i.test(s);
    const c = tn < 10 ? '#FF3B30' : tn < 25 ? '#FF9F0A' : spenta ? '#8E9BB0' : '#30D158';

    const bw = 30 / Math.max(1, inks.length);
    const bars = inks.map((x, j) => { const h = Math.max(0.7, x.v / 100 * 6);
      return `<rect class="ib ${x.v < 10 ? 'cr' : ''}" x="${(23 + j * bw + 0.35).toFixed(2)}" y="${(40 - h).toFixed(2)}" width="${(bw - 0.7).toFixed(2)}" height="${h.toFixed(2)}" rx="0.6" fill="${x.col}"/>`; }).join('');
    return `<div class="mk sp ${stampa ? 'st1' : ''}">
      <svg viewBox="0 0 76 40" class="ic">
        <rect class="fo" x="27" y="2" width="22" height="10" rx="1"/>
        <rect class="co" x="19" y="10" width="38" height="17" rx="4"/>
        <rect class="fe" x="25" y="24" width="26" height="4" rx="1.5"/>
        <g class="usc"><rect class="fo" x="27" y="25" width="22" height="9" rx="1"/><path class="ri" d="M30 28 H46 M30 31 H42"/></g>
        <circle class="led" cx="51" cy="15" r="1.6"/>
        <rect class="tb" x="23" y="33.6" width="30" height="6.4" rx="1"/>${bars}
      </svg>
      <div class="nm">Printer <span class="pc">${isNaN(tn) ? '—' : Math.round(tn) + '%'}</span></div>
      <div class="st">${spenta ? 'OFF' : stampa ? 'PRINTING…' : /powersave|sleep/i.test(s) ? 'SLEEP' : 'READY'}</div>
    </div>`;
    ]]]
extra_styles: |2

  .mk { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 100%; }
  .ic { width: 66px; height: 36px; overflow: visible; filter: drop-shadow(0 0 4px var(--kc)); }
  .nm { font-size: 11px; font-weight: 500; color: #fff; white-space: nowrap; }
  .nm .pc { font-size: 10px; font-weight: 700; color: var(--kc); margin-left: 2px; }
  .st { font-size: 10px; font-weight: 700; color: var(--kc); white-space: nowrap; letter-spacing: .3px; display: flex; align-items: center; gap: 3px; }
  .cr .st { animation: mk_lamp .7s ease-in-out infinite; }
  @keyframes mk_lamp { 50% { opacity: .35; } }
  @keyframes mk_respiro { 50% { box-shadow: 0 0 16px color-mix(in srgb, var(--kc) 60%, transparent), inset 0 0 0 1px var(--kc); } }
  .fi { transform-box: fill-box; transform-origin: 50% 100%; animation: mk_fiamma .9s ease-in-out infinite alternate; }
  .fi2 { animation-duration: .65s; animation-delay: .2s; }
  @keyframes mk_fiamma { 0% { transform: scale(1, 1) skewX(0); } 50% { transform: scale(.92, 1.1) skewX(-4deg); } 100% { transform: scale(1.04, .94) skewX(3deg); } }
  @media (prefers-reduced-motion: reduce) { .mk *, ha-card { animation: none !important; } }

  .sp .co { fill: #24213a; stroke: var(--kc); stroke-width: 1.6; }
  .sp .fo { fill: #eef2f7; } .sp .fe { fill: #0b0a14; }
  .sp .ri { stroke: #8a94a8; stroke-width: 1; }
  .sp .usc { transform: translateY(-6px); }
  .sp.st1 .usc { animation: sp_usc 2.2s ease-in-out infinite; }
  @keyframes sp_usc { 0% { transform: translateY(-8px); } 100% { transform: translateY(2px); } }
  .sp .led { fill: var(--kc); animation: mk_lamp 2s ease-in-out infinite; }
  .sp .tb { fill: rgba(255,255,255,.10); }
  .sp .ib { filter: drop-shadow(0 0 1.5px currentColor); transition: height .6s, y .6s; }
  .sp .ib.cr { animation: mk_lamp .9s ease-in-out infinite; }
styles:
  card:
  - border-radius: 12px
  - padding: 6px 4px
  - background: |-
      [[[

      const rpInks = (S, P) => Object.keys(S).filter(i => i.startsWith(P) && S[i] && S[i].attributes && (S[i].attributes.marker_type !== undefined || (S[i].attributes.unit_of_measurement === '%' && /(toner|ink|cartridge)(_level)?$|_(black|cyan|magenta|yellow)$/i.test(i))) && !/remaining|impression|manufactur|date|serial|install|status/i.test(i) && !isNaN(parseFloat(S[i].state))).map(i => { const f = S[i].attributes.friendly_name || i; const n = f.replace(/^.*?(?=\b(black|cyan|magenta|yellow|photo|gr[ae]y|light|matte|colou?r|tri|nero|ciano|giallo|waste)\b)/i, '').replace(/[\s_]*level$/i, '') || f; const k = (i + ' ' + f).toLowerCase(); const col = /cyan|ciano/.test(k) ? '#00C8FF' : /magenta/.test(k) ? '#FF3DA6' : /yellow|giallo/.test(k) ? '#FFD60A' : /black|nero|matte|photo/.test(k) ? '#D9DEE8' : '#A78BFA'; const r = /black|nero/.test(k) ? 0 : /cyan/.test(k) ? 1 : /magenta/.test(k) ? 2 : /yellow/.test(k) ? 3 : 4; return {id: i, n, col, r, v: Math.max(0, Math.min(100, parseFloat(S[i].state)))}; }).sort((a, b) => a.r - b.r || a.n.localeCompare(b.n));
