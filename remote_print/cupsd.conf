# CUPS solo interno al container (nessuna porta esposta): niente autenticazione
LogLevel warn
Listen /run/cups/cups.sock
Listen 127.0.0.1:631
Browsing Off
DefaultAuthType None
WebInterface No
<Location />
  Order allow,deny
  Allow localhost
</Location>
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>
<Policy default>
  <Limit All>
    Order allow,deny
    Allow localhost
  </Limit>
</Policy>
